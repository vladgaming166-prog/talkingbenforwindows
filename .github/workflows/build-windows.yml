name: Build Windows

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            npm ci && exit 0
            echo "npm ci failed (attempt $i), retrying..."
            sleep $((i * 5))
          done
          exit 1
      - run: npm run icons
      - run: npm run build
      - run: npm test
      - run: npm run verify:no-ads
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: TalkingBen-Windows
          path: |
            release/TalkingBen.exe
            release/TalkingBen-Setup.exe
            release/win-unpacked/TalkingBen.exe
          if-no-files-found: error
