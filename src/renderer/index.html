<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; font-src 'self' data:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Talking Ben</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <div class="phone-frame">
      <header class="top-bar">
        <div class="lab-strip">
          <span class="lab-icons"></span>
          <button type="button" id="btn-lab-banner" class="lab-banner">Visit <em>BEN's</em> lab</button>
          <span class="lab-tubes"></span>
        </div>
        <button type="button" id="btn-camera" class="fab top-left" title="Camera" aria-label="Camera"></button>
        <button type="button" id="btn-info" class="fab top-right" title="Settings" aria-label="Settings">i</button>
      </header>

      <main class="stage">
        <canvas id="ben-canvas" aria-label="Ben"></canvas>
        <div id="mic-indicator"></div>
        <div class="subtitle" id="subtitle" hidden></div>
        <div id="call-banner" class="call-banner" hidden>Speak now — Ben is listening</div>
        <button type="button" id="btn-lab" class="fab mid-right flask" title="Lab" aria-label="Lab"></button>
      </main>

      <footer class="bottom-bar" id="living-controls">
        <button type="button" id="btn-drink" class="fab bottom bottle" title="Drink" aria-label="Drink"></button>
        <button type="button" id="btn-food" class="fab bottom food" title="Food" aria-label="Food"></button>
        <button type="button" id="btn-talk" class="fab bottom talk" title="Talk" aria-label="Talk"></button>
        <button type="button" id="btn-phone" class="fab bottom phone" title="Phone" aria-label="Phone"></button>
      </footer>

      <footer class="bottom-bar lab-bar" id="lab-controls" hidden>
        <button type="button" class="fab tube" data-tube="0" style="--c:#f0c93a" title="Yellow"></button>
        <button type="button" class="fab tube" data-tube="1" style="--c:#4caf50" title="Green"></button>
        <button type="button" class="fab tube" data-tube="2" style="--c:#4ec3ff" title="Cyan"></button>
        <button type="button" class="fab tube" data-tube="3" style="--c:#e85aad" title="Pink"></button>
        <button type="button" class="fab tube" data-tube="4" style="--c:#3d6fb5" title="Blue"></button>
        <button type="button" id="btn-home" class="fab bottom chair" title="Home" aria-label="Living room"></button>
      </footer>
    </div>

    <form id="text-fallback" class="text-fallback" hidden>
      <input type="text" id="text-input" placeholder="Type while on the phone…" maxlength="200" autocomplete="off" />
      <button type="submit">Say</button>
    </form>

    <div class="win-tray">
      <button type="button" id="btn-minimize" title="Minimize">─</button>
      <button type="button" id="btn-maximize" title="Maximize">□</button>
      <button type="button" id="btn-close" title="Exit">✕</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
